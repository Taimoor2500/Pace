<div style="font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;color:#0E1116">
  <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#2FBF68,#127A3A);margin-bottom:24px"></div>
  <h2 style="margin:0 0 8px;font-size:22px">Your Pace sign-in code</h2>
  <p style="margin:0 0 24px;color:#5B6170;font-size:15px">Enter this code in the app. It expires in 1 hour.</p>
  <div style="font-size:34px;font-weight:700;letter-spacing:8px;padding:16px 0;text-align:center;background:#E8F6ED;border-radius:16px;color:#1F9D4C">{{ .Token }}</div>
  <p style="margin:24px 0 0;color:#5B6170;font-size:14px">On your phone? <a href="{{ .ConfirmationURL }}" style="color:#1F9D4C;font-weight:600">Tap here to sign in</a> instead.</p>
  <p style="margin:24px 0 0;color:#9AA0AA;font-size:12px">If you didn’t request this, you can ignore this email.</p>
</div>
